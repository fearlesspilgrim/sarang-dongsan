<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F1EA" />
    <title>기도제목 목업 · 사랑동산</title>
    <link
      rel="stylesheet"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              cream: "#F6F1EA",
              ivory: "#FBF7F2",
              ink: "#1C1917",
              muted: "#78716C",
              terra: "#C45C4A",
              sage: "#5B7C6E",
              church: "#4C5E8A",
              gold: "#C4A35A",
            },
            fontFamily: {
              sans: ["Pretendard", "ui-sans-serif", "system-ui", "sans-serif"],
            },
            boxShadow: {
              sheet: "0 -8px 32px rgba(28, 25, 23, 0.12)",
            },
          },
        },
      };
    </script>
    <style>
      html,
      body {
        height: 100%;
        background: #f6f1ea;
      }
      body {
        min-height: 100dvh;
        -webkit-tap-highlight-color: transparent;
      }
      .tabbar-safe {
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      .hide-scroll::-webkit-scrollbar {
        display: none;
      }
      .hide-scroll {
        scrollbar-width: none;
      }
      .clamp-3 {
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      @keyframes toast-in {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .toast-in {
        animation: toast-in 0.18s ease-out;
      }
      @keyframes sheet-up {
        from {
          transform: translateY(100%);
        }
        to {
          transform: translateY(0);
        }
      }
      .sheet-up {
        animation: sheet-up 0.22s ease-out;
      }
    </style>
  </head>
  <body class="font-sans text-ink antialiased">
    <div id="app" class="relative mx-auto h-dvh w-full max-w-[430px] overflow-hidden bg-cream shadow-[0_0_0_1px_rgba(28,25,23,0.04)]"></div>
    <script>
      const ME = "김현철";
      const MEMBERS = [
        { name: "김현철", peer: "94", birth: "12/17", phone: "010-4046-8954", role: "동산지기", prayer: "새 학기 순원들과 깊이 알아가기를 원합니다.\n부모님의 건강과, 순을 섬길 지혜를 위해 기도해 주세요.", updated: "10월 9일" },
        { name: "이재영", peer: "94", birth: "2/9", phone: "010-6406-3163", role: "", prayer: "맡은 일을 성실히 감당하게 해 주세요.\n순원들 한 명 한 명 마음을 알아가게 해 주세요.", updated: "10월 6일" },
        { name: "최나라", peer: "94", birth: "9/7", phone: "010-4114-6941", role: "", prayer: "준비하는 시간 동안 마음에 평안을 지켜 주세요.\n가족들의 구원을 위해 기도합니다.", updated: "10월 3일" },
        { name: "남궁지은", peer: "95", birth: "4/5", phone: "010-2407-2484", role: "", prayer: "수업과 순모임 사이에서 중심을 지키게 해 주세요.", updated: "9월 28일" },
        { name: "유리하", peer: "96", birth: "6/7", phone: "010-2796-2184", role: "", prayer: "건강을 회복하고, 예배에 기쁨으로 나아가게 해 주세요.", updated: "10월 11일" },
        { name: "조예성", peer: "96", birth: "10/22", phone: "010-6339-9466", role: "", prayer: "", updated: "" },
        { name: "정효진", peer: "97", birth: "7/16", phone: "010-3933-3388", role: "", prayer: "진로를 정할 때 하나님의 뜻을 분별하게 해 주세요.\n관계가 어려운 친구와 화목하기를 원합니다.", updated: "10월 1일" },
        { name: "최은서", peer: "00", birth: "3/20", phone: "010-6339-9466", role: "", prayer: "학교 생활 가운데 빛으로 서게 해 주세요.", updated: "10월 8일" },
      ];

      const state = {
        tab: "home",
        sheet: null,
        draft: "",
        toast: "",
        saving: false,
      };
      let toastTimer = null;
      const appEl = document.getElementById("app");

      function esc(value) {
        return String(value ?? "").replace(/[&<>"']/g, (ch) =>
          ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch])
        );
      }

      function memberByName(name) {
        return MEMBERS.find((m) => m.name === name) || null;
      }

      function me() {
        return memberByName(ME);
      }

      function firstLine(text) {
        const line = String(text || "")
          .split("\n")
          .map((item) => item.trim())
          .find(Boolean);
        return line || "";
      }

      function timeGreeting() {
        const hour = Number(
          new Intl.DateTimeFormat("en-US", { timeZone: "Asia/Seoul", hour: "numeric", hourCycle: "h23" })
            .formatToParts(new Date())
            .find((part) => part.type === "hour").value
        );
        if (hour >= 5 && hour < 11) return "좋은 아침이에요";
        if (hour >= 11 && hour < 14) return "점심은 맛있게 먹었나요?";
        if (hour >= 14 && hour < 18) return "오후도 편하게 보내고 있나요?";
        if (hour >= 18 && hour < 22) return "오늘 하루도 수고했어요";
        return "늦은 시간이네요";
      }

      function iconHome(active) {
        return `<svg viewBox="0 0 24 24" class="h-6 w-6" fill="${active ? "currentColor" : "none"}" stroke="currentColor" stroke-width="1.8"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg>`;
      }
      function iconCal(active) {
        return `<svg viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="${active ? "2.2" : "1.8"}"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>`;
      }
      function iconPeople(active) {
        return `<svg viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="${active ? "2.2" : "1.8"}"><circle cx="9" cy="8" r="3"/><path d="M4 19c.5-3 2.4-5 5-5s4.5 2 5 5"/><circle cx="16.5" cy="8.5" r="2.4"/><path d="M16 14.2c2.2.3 3.8 2.2 4.3 4.8"/></svg>`;
      }
      function iconLink(active) {
        return `<svg viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="${active ? "2.2" : "1.8"}" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.4l1.6-1.6a5 5 0 0 0-7.1-7.1L10.6 6"/><path d="M14 11a5 5 0 0 0-7.5-.4L4.9 12.2a5 5 0 0 0 7.1 7.1l1.4-1.4"/></svg>`;
      }
      function iconCoram(active) {
        return `<svg viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="${active ? "2.2" : "1.8"}" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.2c-1.7-1.1-3.7-1.7-6.2-1.7v13.4c2.5 0 4.5.6 6.2 1.7 1.7-1.1 3.7-1.7 6.2-1.7V4.5c-2.5 0-4.5.6-6.2 1.7z"/><path d="M12 6.2v13.4"/></svg>`;
      }

      function tabbar() {
        const tab = (id, label, icon) => {
          const on = state.tab === id;
          return `
            <button data-action="tab" data-tab="${id}" class="flex flex-1 flex-col items-center gap-0.5 py-2.5 ${on ? "text-terra" : "text-muted"}">
              ${icon(on)}
              <span class="whitespace-nowrap text-[11px] font-medium">${label}</span>
            </button>`;
        };
        return `
          <nav class="tabbar-safe z-30 shrink-0 border-t border-stone-200/80 bg-ivory/95 backdrop-blur">
            <div class="flex px-2">
              ${tab("home", "홈", iconHome)}
              ${tab("schedule", "일정", iconCal)}
              ${tab("members", "구성원", iconPeople)}
              ${tab("coram", "코람데오", iconCoram)}
              ${tab("links", "주요링크", iconLink)}
            </div>
          </nav>`;
      }

      function prayerPreview(text) {
        const line = firstLine(text);
        if (!line) return `<span class="mt-2 block truncate text-[13px] text-stone-400">기도제목 없음</span>`;
        return `<span class="mt-2 block truncate text-[13px] leading-snug text-ink/80">${esc(line)}</span>`;
      }

      function editorFields() {
        const count = state.draft.length;
        return `
          <textarea id="prayer-draft" maxlength="500" rows="6"
            class="mt-4 w-full resize-none rounded-2xl border border-stone-200 bg-cream px-4 py-3 text-[15px] leading-relaxed outline-none focus:border-terra"
            placeholder="함께 기도할 내용을 적어 주세요">${esc(state.draft)}</textarea>
          <p class="mt-2 text-right text-[12px] text-muted"><span id="prayer-count">${count}</span>/500</p>
          <button data-action="save-prayer" class="mt-3 h-[52px] w-full rounded-2xl bg-terra text-[16px] font-semibold text-ivory">${state.saving ? "저장하고 있어요" : "저장"}</button>`;
      }

      function homeView() {
        const mine = me();
        const body = mine.prayer
          ? `<p class="clamp-3 mt-3 whitespace-pre-wrap text-[15px] leading-relaxed">${esc(mine.prayer)}</p>
             <p class="mt-3 text-[12px] text-muted">${esc(mine.updated)} 수정</p>`
          : `<p class="mt-2 text-[14px] text-muted">아직 적은 기도제목이 없습니다</p>`;
        return `
          <header class="px-5 pt-6">
            <p class="text-[13px] font-medium text-terra">사랑동산</p>
            <h1 class="mt-3 text-[24px] font-semibold">안녕하세요, 김현철 지기님</h1>
            <p class="mt-2 text-[13px] text-muted">${esc(timeGreeting())}</p>
          </header>

          <section class="mx-5 mt-6 rounded-[24px] border border-stone-200/80 bg-ivory p-5">
            <div class="flex items-center justify-between gap-3">
              <h2 class="text-[18px] font-semibold">내 기도제목</h2>
              <button data-action="edit-prayer" class="shrink-0 rounded-full bg-terra/10 px-3 py-1.5 text-[13px] font-semibold text-terra">${mine.prayer ? "수정" : "적기"}</button>
            </div>
            ${body}
          </section>

          <section class="mx-5 mt-4 rounded-[24px] border border-stone-200/80 bg-ivory p-5">
            <div class="flex items-baseline justify-between gap-3">
              <h2 class="text-[18px] font-semibold">이번 주 일정</h2>
              <span class="shrink-0 text-[13px] font-medium text-stone-400">10/12–10/18</span>
            </div>
            <div class="mt-3">
              <div class="flex items-start gap-3 py-2">
                <div class="w-10 shrink-0 pt-0.5 text-center">
                  <div class="text-[15px] font-semibold leading-none">18</div>
                  <div class="mt-1 text-[11px] leading-none text-muted">일</div>
                </div>
                <div class="min-w-0 flex-1">
                  <span class="inline-flex items-center gap-1.5 text-[12px] font-semibold text-sage"><svg viewBox="0 0 24 24" class="h-3 w-3 shrink-0" fill="currentColor" aria-hidden="true"><path d="M12 20.5s-7.2-4.6-9.4-8.4C.8 9.2 2 5.8 5.4 5c2-.5 3.8.3 6.6 3.2C14.8 5.3 16.6 4.5 18.6 5c3.4.8 4.6 4.2 2.8 7.1-2.2 3.8-9.4 8.4-9.4 8.4z"/></svg>대청부</span>
                  <p class="mt-1 text-[15px] leading-snug">GBS 특별교재 · LBS 7과</p>
                </div>
              </div>
            </div>
          </section>

          <section class="mx-5 mt-4 rounded-[24px] border border-stone-200/80 bg-ivory p-5">
            <h2 class="text-[18px] font-semibold">생일자</h2>
            <p class="mt-2 text-[14px] text-muted">이번 주 생일자가 없습니다</p>
            <p class="mt-4 text-[12px] font-semibold text-muted">이번 달</p>
            <ul class="mt-1">
              <li class="flex items-center justify-between py-1 text-[14px]">
                <span>조예성</span>
                <span class="text-muted">10/22</span>
              </li>
            </ul>
          </section>

          <div class="px-5 pb-6 pt-8 text-center">
            <button data-action="logout" class="rounded-full border border-stone-200/70 px-5 py-2 text-[13px] text-stone-400">로그아웃</button>
          </div>`;
      }

      function membersView() {
        return `
          <header class="px-5 pt-6">
            <p class="text-[13px] font-medium text-terra">사랑동산</p>
            <h1 class="mt-3 text-[24px] font-semibold">구성원</h1>
            <p class="mt-2 text-[13px] leading-snug text-muted">내가 너희를 사랑한 것 같이 서로 사랑하라(요15:12)</p>
          </header>
          <div class="mt-6 px-5 pb-4">
            <div class="grid grid-cols-2 gap-2">
              ${MEMBERS.map((m) => `
                <button data-action="open-member" data-name="${esc(m.name)}" class="flex h-full items-center gap-1 rounded-[24px] border border-stone-200/80 bg-ivory py-3 pl-3.5 pr-2.5 text-left active:bg-cream">
                  <span class="min-w-0 flex-1">
                    <span class="flex flex-wrap items-center gap-1">
                      <span class="text-[16px] font-medium">${esc(m.name)}</span>
                      ${m.role ? `<span class="shrink-0 rounded-full border border-terra/30 px-1.5 py-0.5 text-[10px] font-medium leading-none text-terra">${esc(m.role)}</span>` : ""}
                    </span>
                    <span class="mt-1 block text-[12px] text-muted">${esc(m.peer)}또래 · ${esc(m.birth)}</span>
                    ${prayerPreview(m.prayer)}
                  </span>
                  <span class="shrink-0 text-[16px] leading-none text-stone-400" aria-hidden="true">›</span>
                </button>`).join("")}
            </div>
          </div>`;
      }

      function memberSheet() {
        if (state.sheet !== "member") return "";
        const m = memberByName(state.selected);
        if (!m) return "";
        const mine = m.name === ME;
        const prayer = mine
          ? editorFields()
          : m.prayer
            ? `<p class="mt-3 whitespace-pre-wrap text-[15px] leading-relaxed">${esc(m.prayer)}</p>
               <p class="mt-3 text-[12px] text-muted">${esc(m.updated)} 수정</p>`
            : `<p class="mt-3 text-[14px] text-muted">아직 기도제목이 없어요</p>`;
        return `
          <div id="member-sheet-backdrop" class="absolute inset-0 z-40 bg-ink/30" data-action="close-sheet"></div>
          <div id="member-sheet" class="absolute inset-x-0 bottom-0 z-50 max-h-[82vh] overflow-y-auto rounded-t-[28px] bg-ivory px-5 pb-8 pt-1 shadow-sheet sheet-up hide-scroll">
            <div class="-mx-5 flex h-8 items-center justify-center" aria-hidden="true">
              <span class="h-1 w-10 rounded-full bg-stone-300"></span>
            </div>
            <p class="text-[18px] font-semibold">${esc(m.name)}</p>
            <p class="text-[13px] text-muted">${esc(m.peer)}또래${m.role ? ` · ${esc(m.role)}` : ""} · 생일 ${esc(m.birth)}</p>
            <p class="mt-6 text-center text-[28px] font-semibold tracking-wide">${esc(m.phone)}</p>
            <button data-action="copy-phone" class="mt-5 h-[52px] w-full rounded-2xl bg-terra text-[16px] font-semibold text-ivory">번호 복사</button>
            <div class="mt-6 border-t border-stone-100 pt-5">
              <h2 class="text-[16px] font-semibold">기도제목</h2>
              ${prayer}
            </div>
          </div>`;
      }

      function editSheet() {
        if (state.sheet !== "edit") return "";
        return `
          <div class="absolute inset-0 z-40 bg-ink/30" data-action="close-sheet"></div>
          <div class="absolute inset-x-0 bottom-0 z-50 max-h-[82vh] overflow-y-auto rounded-t-[28px] bg-ivory px-5 pb-8 pt-1 shadow-sheet sheet-up hide-scroll">
            <div class="-mx-5 flex h-8 items-center justify-center" aria-hidden="true">
              <span class="h-1 w-10 rounded-full bg-stone-300"></span>
            </div>
            <p class="text-[18px] font-semibold">내 기도제목</p>
            <p class="mt-1 text-[13px] text-muted">구성원들과 함께 기도할 내용입니다</p>
            ${editorFields()}
          </div>`;
      }

      function toastView() {
        if (!state.toast) return "";
        return `<div class="pointer-events-none absolute inset-x-0 bottom-24 z-[60] px-8"><div class="toast-in rounded-full bg-ink/90 px-4 py-2.5 text-center text-[13px] text-ivory">${esc(state.toast)}</div></div>`;
      }

      function showToast(message) {
        state.toast = message;
        render();
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          state.toast = "";
          render();
        }, 1500);
      }

      function render() {
        const body = state.tab === "members" ? membersView() : homeView();
        appEl.innerHTML = `
          <div class="flex h-full min-h-0 flex-col overflow-hidden bg-cream">
            <div id="main-scroll" class="min-h-0 flex-1 overflow-y-auto hide-scroll overscroll-y-contain pb-4">
              ${body}
            </div>
            ${tabbar()}
          </div>
          ${memberSheet()}
          ${editSheet()}
          ${toastView()}`;
        bind();
      }

      function openEdit() {
        state.draft = me().prayer;
        state.sheet = "edit";
        state.selected = ME;
        render();
        document.getElementById("prayer-draft")?.focus();
      }

      function savePrayer() {
        const area = document.getElementById("prayer-draft");
        const next = String(area ? area.value : state.draft).trim().slice(0, 500);
        const mine = me();
        mine.prayer = next;
        mine.updated = next ? "10월 12일" : "";
        state.draft = next;
        state.sheet = null;
        showToast(next ? "기도제목을 남겼어요" : "기도제목을 지웠어요");
      }

      function bind() {
        appEl.querySelectorAll("[data-action]").forEach((el) => {
          el.addEventListener("click", () => {
            const action = el.getAttribute("data-action");
            if (action === "tab") {
              const next = el.getAttribute("data-tab");
              if (next !== "home" && next !== "members") {
                showToast("목업에서는 홈과 구성원만 볼 수 있어요");
                return;
              }
              state.tab = next;
              state.sheet = null;
              render();
              return;
            }
            if (action === "edit-prayer") {
              openEdit();
              return;
            }
            if (action === "open-member") {
              state.selected = el.getAttribute("data-name");
              state.sheet = "member";
              state.draft = state.selected === ME ? me().prayer : "";
              render();
              if (state.selected === ME) document.getElementById("prayer-draft")?.focus();
              return;
            }
            if (action === "close-sheet") {
              state.sheet = null;
              render();
              return;
            }
            if (action === "save-prayer") {
              savePrayer();
              return;
            }
            if (action === "copy-phone") {
              const m = memberByName(state.selected);
              if (m) navigator.clipboard?.writeText(m.phone).catch(() => {});
              showToast("번호를 복사했습니다");
              return;
            }
            if (action === "logout") {
              showToast("목업에서는 로그아웃하지 않아요");
            }
          });
        });
        const area = document.getElementById("prayer-draft");
        const count = document.getElementById("prayer-count");
        if (area && count) {
          area.addEventListener("input", () => {
            state.draft = area.value.slice(0, 500);
            if (area.value !== state.draft) area.value = state.draft;
            count.textContent = String(state.draft.length);
          });
        }
      }

      const start = decodeURIComponent(location.hash.replace(/^#/, ""));
      if (start === "members" || start.startsWith("member-")) state.tab = "members";
      if (start === "edit") {
        state.draft = me().prayer;
        state.sheet = "edit";
        state.selected = ME;
      }
      if (start.startsWith("member-")) {
        const name = start.slice("member-".length);
        if (memberByName(name)) {
          state.selected = name;
          state.sheet = "member";
          state.draft = name === ME ? me().prayer : "";
        }
      }
      render();
    </script>
  </body>
</html>
